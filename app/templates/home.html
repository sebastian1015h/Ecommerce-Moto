{% extends 'base.html' %}
{% block content %}
<section class="hero" aria-labelledby="hero-title">
  <img class="hero-photo hero-model" src="{{ url_for('static', path='images/models/duke-black.webp') }}" alt="KTM 390 Duke en negro" fetchpriority="high">
  <div class="shell hero-inner">
    <div class="hero-copy">
      <h1 id="hero-title">Encuentra tu<br>próxima moto</h1>
      <a class="button" href="{{ url_for('catalog') }}">Ver catálogo <span aria-hidden="true">↗</span></a>
    </div>
    <div class="featured">
      <strong>KTM 390 Duke</strong>
      <a href="{{ url_for('moto_detail', slug='ktm-390-duke') }}">Ver ficha <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>
<nav class="brand-strip" aria-label="Explorar por marca">
  <div class="shell brand-list">
    {% for brand in brands %}
    <a href="{{ url_for('catalog') }}?marca={{ brand }}">{{ brand }}</a>
    {% endfor %}
  </div>
</nav>
<section class="shell categories" aria-labelledby="categories-title">
  <div class="section-head">
    <h2 id="categories-title">Explora por categoría</h2>
    <a class="text-link" href="{{ url_for('catalog') }}">Todas las motos <span aria-hidden="true">↗</span></a>
  </div>
  <div class="category-grid">
    {% for slug, category in categories.items() %}
    <a class="category-card" href="{{ url_for('catalog') }}?categoria={{ slug }}">
      <img src="{{ url_for('static', path='images/' ~ slug ~ '.webp') }}" alt="" width="640" height="640" loading="lazy">
      <span>{{ category }} <span aria-hidden="true">↗</span></span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
