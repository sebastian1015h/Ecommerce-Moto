{% extends 'base.html' %}
{% block title %}Gerencia · Moto Garaje{% endblock %}
{% block content %}
<section class="shell page manager-page">
  <a class="text-link" href="{{ url_for('catalog') }}">← Catálogo</a>
  <h1>Gerencia</h1>
  <p class="subtle">Agrega una moto y su foto al catálogo.</p>
  <form class="manager-form lab-panel lab-form" action="{{ url_for('manager_create') }}" method="post" enctype="multipart/form-data">
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <div class="manager-fields">
      <label>Marca
        <select name="marca" required>
          <option value="">Elige una marca</option>
          {% for brand in brands %}
          <option {% if values.marca == brand %}selected{% endif %}>{{ brand }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Modelo<input name="modelo" maxlength="80" required value="{{ values.modelo or '' }}" placeholder="Ej. MT-07"></label>
      <label>Categoría
        <select name="categoria" required>
          <option value="">Elige una categoría</option>
          {% for slug, category in categories.items() %}
          <option value="{{ slug }}" {% if values.categoria == slug %}selected{% endif %}>{{ category }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Color<input name="color" maxlength="40" required value="{{ values.color or '' }}" placeholder="Ej. Azul metálico"></label>
    </div>
    <label>Foto del modelo
      <input name="imagen" type="file" accept="image/jpeg,image/png,image/webp" required aria-describedby="photo-limit">
    </label>
    <p id="photo-limit">JPG, PNG o WebP. Máximo 5 MB.</p>
    <button class="button" type="submit">Agregar al catálogo</button>
  </form>
</section>
{% endblock %}
