<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Moto Garaje · Encuentra tu próxima moto{% endblock %}</title>
  <meta name="description" content="Explora motos urbanas, scooters, deportivas y de aventura en Moto Garaje.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='store.css') }}">
  <script src="{{ url_for('static', path='store.js') }}" defer></script>
</head>
<body>
  <a class="skip" href="#contenido">Ir al contenido</a>
  <header class="top">
    <div class="shell nav">
      <a class="wordmark" href="{{ url_for('home') }}"><span aria-hidden="true"></span>MOTO GARAJE</a>
      <nav aria-label="Principal">
        <a href="{{ url_for('home') }}" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="{{ url_for('catalog') }}" {% if request.url.path == '/motos' %}aria-current="page"{% endif %}>Catálogo</a>
        <a href="{{ url_for('lab') }}" {% if request.url.path == '/laboratorio' %}aria-current="page"{% endif %}>Laboratorio</a>
        <a href="{{ url_for('manager') }}" {% if request.url.path == '/gerencia' %}aria-current="page"{% endif %}>Gerencia</a>
      </nav>
      <a class="search" aria-label="Buscar motos" href="{{ url_for('catalog') }}#buscar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      </a>
    </div>
  </header>
  <main id="contenido">{% block content %}{% endblock %}</main>
  <footer class="footer">
    <div class="shell footer-inner">
      <a class="wordmark" href="{{ url_for('home') }}"><span aria-hidden="true"></span>MOTO GARAJE</a>
      <a href="{{ url_for('swagger_ui_html') }}">Swagger UI <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
